<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Ainoa's Personal Internet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Reenie+Beanie&display=swap">
<style>
/* Layout: one quiet desktop. Small type pinned to the corners, the portrait floating
   off-centre, one large typed question at the bottom. Everything else arrives as a window. */
:root{
  --bg:#f3f3f0; --fg:#111110; --paper:#ffffff; --mute:#84847e; --wmute:#84847e;
  --red:#ff2a1a; --blue:#1f3fff; --yellow:#ffe500;
  --sans:"Helvetica Neue",Helvetica,Arimo,Arial,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Arimo,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --hand:"Reenie Beanie","Bradley Hand","Segoe Script",cursive;
  --gut:clamp(16px,2.4vw,36px);
}
:root[data-tint="red"]{--bg:var(--red)}
:root[data-tint="yellow"]{--bg:var(--yellow)}
:root[data-tint="blue"]{--bg:var(--blue);--fg:#ffffff;--mute:#ffffffb0}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .35s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
::selection{background:var(--yellow);color:#111110}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
:root[data-tint="blue"] :focus-visible{outline-color:#fff}

/* ───────── desktop ───────── */
.desk{position:relative;isolation:isolate;min-height:100%;background:var(--bg);transition:background-color .35s;
  padding-block:20px 24px;padding-inline:var(--gut);overflow-x:clip;
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto 1fr auto;column-gap:16px}
.id{grid-column:1/6;grid-row:1}
.id b{display:block;font-weight:400;letter-spacing:.04em}
.meta{grid-column:9/13;grid-row:1;text-align:right;font-family:var(--sys);font-size:12px;font-variant-numeric:tabular-nums}
.meta span{display:block}
.nav{grid-column:1/3;grid-row:2;align-self:center;display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:-6vh}
.nav button{letter-spacing:.04em;padding:1px 3px;margin-left:-3px}
.nav button:hover,.nav button:focus-visible{background:var(--yellow);color:#111110}
.me{grid-column:5/10;grid-row:2;align-self:center;justify-self:center;position:relative;margin:4vh 0 0;height:min(60vh,580px);aspect-ratio:1232/1400;max-width:100%}
.me>img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none;
  -webkit-mask-image:linear-gradient(#000 88%,transparent),linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(#000 88%,transparent),linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-composite:intersect}
.hand{position:absolute;left:-37%;top:25%;margin:0;font:26px/1 var(--hand);color:var(--blue);transform:rotate(-5deg);white-space:nowrap;pointer-events:none}
:root[data-tint="blue"] .hand{color:#fff}
.who{grid-column:1/10;grid-row:3;align-self:end;justify-self:start;font-size:clamp(44px,8.4vw,128px);line-height:.9;letter-spacing:-.045em;white-space:nowrap}
.who:hover{color:var(--blue)}
:root[data-tint] .who:hover{color:inherit}
.caret{display:inline-block;width:.045em;height:.78em;margin-left:.06em;background:currentColor;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.files{grid-column:11/13;grid-row:2;align-self:start;justify-self:end;margin:9vh 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:22px;align-items:center}
.file{display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;font:11px/1.25 var(--sys);text-align:center}
.file i{display:block;width:26px;height:33px;background:var(--paper);border:1px solid #111110;position:relative}
.file i::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;background:var(--bg);border-left:1px solid #111110;border-bottom:1px solid #111110;transition:background-color .35s}
.file span{padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.file:hover span,.file:focus-visible span{background:var(--blue);color:#fff}
.file:focus-visible{outline:none}

.lang{display:inline-flex;gap:8px}
.lang button{padding:1px 3px;color:var(--mute);opacity:.75}
.wbar .lang{margin-left:10px}
.wbar .lang button{color:var(--cmute);margin-left:0}
.lang button[aria-pressed="true"]{color:inherit;opacity:1;text-decoration:underline;text-underline-offset:4px}
.meta .lang{display:flex;justify-content:flex-end;margin-top:8px}
.meta .lang button:hover,.meta .lang button:focus-visible{background:var(--yellow);color:#111110;opacity:1}
/* ───────── dots ───────── */
.dot{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:#fff;border:1px solid #111110;z-index:5;touch-action:none;
  transition:width .28s cubic-bezier(.3,1.2,.4,1),height .28s cubic-bezier(.3,1.2,.4,1),margin .28s cubic-bezier(.3,1.2,.4,1)}
.dot::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.dot img,.dot .nf{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;opacity:0;transition:opacity .2s;pointer-events:none}
.dot img{object-fit:cover;object-position:var(--p,50% 50%)}
.dot .nf{display:grid;place-items:center;background:var(--paper);font:28px var(--sys);color:var(--wmute)}
.dot .lb{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);font:10px/1 var(--mono);color:#111110;background:#fff;padding:2px 3px;white-space:nowrap;pointer-events:none}
.dot .lb em{display:none;font-style:normal}
.dot.on{--s:168px;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);z-index:20;cursor:pointer}
.dot.on img,.dot.on .nf{opacity:1}
.dot.on .lb{left:50%;top:calc(100% + 8px);transform:translateX(-50%)}
.dot.on .lb em{display:inline}
.dot.drag{transition:none;cursor:grabbing}
.dot:focus-visible{outline-offset:3px}

/* ───────── windows ───────── */
.win{position:fixed;z-index:100;display:flex;flex-direction:column;max-height:calc(100% - 16px);background:var(--paper);color:#111110;
  border:1px solid #111110;border-radius:7px;box-shadow:0 18px 44px -18px #11111066;font-family:var(--sys);overflow:hidden;animation:open .16s ease-out}
@keyframes open{from{opacity:0;transform:scale(.97)}}
.bar{flex:none;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-bottom:1px solid #111110;cursor:grab;user-select:none;touch-action:none;position:relative}
.bar:active{cursor:grabbing}
.bar .x,.bar i{flex:none;width:10px;height:10px;border-radius:50%;border:1px solid #111110;background:#fff}
.bar .x{position:relative}
.bar .x::before{content:"";position:absolute;inset:-9px}
.bar .x:hover,.bar .x:focus-visible{background:var(--red)}
.bar b{position:absolute;left:60px;right:60px;text-align:center;font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.body{overflow:auto;min-height:0}
.btn{font:12px var(--sys);letter-spacing:.04em;padding:5px 14px;border:1px solid #111110;border-radius:5px;background:#fff;color:#111110;white-space:nowrap}
.btn:hover{background:#111110;color:#fff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#111110;border-color:#111110}
.win :focus-visible{outline-color:var(--blue)}

.alert .bar{display:none}
.alert .body{padding:18px 18px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px 14px}
.alert .ic{width:34px;height:34px;border-radius:50%;border:1px solid #111110;display:grid;place-items:center;font:700 18px var(--sans)}
.alert h2{margin:0 0 4px;font:700 13px/1.3 var(--sys)}
.alert p{margin:0;font-size:12px;line-height:1.5}
.alert p a{color:var(--blue)}
.alert .row{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.sel{user-select:all;font-family:var(--mono);font-size:12px}
#scrim{position:fixed;inset:0;z-index:95;background:#f3f3f08c}

.pv .body{display:flex;flex-direction:column}
.pv img,.pv video{display:block;width:100%;max-height:62vh;object-fit:contain;background:#eeeeea}
.pv video{background:#000}
.pv p{margin:0;padding:9px 12px 11px;font-size:12px;line-height:1.45;border-top:1px solid #111110}
.pv p b{font-weight:700}
.pv p .btn{display:block;margin-top:8px}
.pv p a.btn{display:block;width:fit-content;text-decoration:none}
.emb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000 center/cover no-repeat}
.emb iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none}

.pb .body{background:#191918;color:#fff;overflow:hidden}
.pb-view{position:relative;aspect-ratio:4/3;max-height:52vh;width:100%;background:#000}
.pb-view img{display:block;width:100%;height:100%;object-fit:contain}
.pb-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.pb-flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.pb-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:9px 12px;font:11px var(--mono)}
.pb-bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pb-shot{width:38px;height:38px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 1px #000 inset}
.pb-shot:hover{filter:brightness(1.15)}
.pb-shot:focus-visible,.pb-tray button:focus-visible{outline-color:#fff}
.pb-tray{display:flex;gap:6px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:thin}
.pb-tray button{flex:0 0 58px;aspect-ratio:4/3;border:1px solid #ffffff55;overflow:hidden;opacity:.55}
.pb-tray button[aria-current="true"]{opacity:1;border-color:#fff}
.pb-tray img{display:block;width:100%;height:100%;object-fit:cover}

.txt .body{padding:16px 18px 20px;font:12.5px/1.7 var(--mono)}
.txt p{margin:0 0 1.1em;max-width:62ch}
.txt p:last-child{margin:0}

.help .body{padding:18px 20px 16px;font:15px/1.5 var(--sans);letter-spacing:.02em}
.help h2{margin:0 0 10px;font:400 34px/1 var(--sans);letter-spacing:-.03em;color:var(--red)}
.help p{margin:0}
.roles{list-style:none;margin:2px 0;padding:0}
.roles li{display:flex;align-items:center;gap:6px;min-height:24px}
.role .t{cursor:grab;touch-action:none;padding:0 3px;margin-left:-3px;border-radius:2px;outline:none}
.role:hover .t,.role .t:focus-visible{background:var(--yellow)}
.role .t[contenteditable="true"]{cursor:text;background:#fff;box-shadow:0 0 0 2px var(--blue)}
.role.moving{opacity:.4}
.role .sl{color:var(--wmute)}
.role .del{width:18px;height:18px;border-radius:50%;border:1px solid #111110;font:12px/1 var(--sys);text-align:center;opacity:0;margin-left:4px}
.role:hover .del,.role .del:focus-visible,.role:focus-within .del{opacity:1}
.role .del:hover{background:var(--red);border-color:var(--red);color:#fff}
.blank input{font:inherit;letter-spacing:inherit;color:inherit;border:0;border-bottom:1px solid #111110;background:none;width:11em;max-width:100%;padding:0;border-radius:0;text-transform:uppercase}
.blank input::placeholder{color:transparent}
.blank input:focus{outline:none;border-bottom-color:var(--blue);box-shadow:0 1px 0 var(--blue)}
.help footer{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:10px;border-top:1px solid #11111022;font:11px/1.4 var(--sys);letter-spacing:0;color:var(--wmute)}

.rn .body{padding:16px 18px 14px;font-size:12px}
.rn label{display:block;margin-bottom:8px}
.rn .old{font:13px var(--mono);color:var(--wmute);text-decoration:line-through}
.rn .arrow{display:block;margin:4px 0 6px;font-size:14px}
.rn input{display:block;width:100%;font:13px var(--mono);padding:5px 7px;border:1px solid #111110;border-radius:4px;background:#fff;color:#111110;text-transform:uppercase}
.rn input:focus{outline:2px solid var(--blue);outline-offset:1px}
.rn .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ───────── AINOA.FM ───────── */
.fm{position:fixed;z-index:90;right:var(--gut);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:236px;max-width:calc(100% - 2*var(--gut));background:var(--paper);color:#111110;border:1px solid #111110;border-radius:7px;overflow:hidden;font-family:var(--sys)}
.fm.open{width:340px}
.fm .bar{cursor:default;height:22px}
.fm .bar b{left:10px;right:10px;font-size:11px;letter-spacing:.08em}
.fm-main{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:9px 10px 8px}
.fm-play{width:32px;height:32px;border-radius:50%;border:1px solid #111110;background:#fff;color:#111110;display:grid;place-items:center;text-decoration:none;font-size:14px;line-height:1}
.fm-play:hover{background:#111110;color:#fff}
.fm-play:disabled{opacity:.35;cursor:default;background:#fff;color:#111110}
.fm-play svg{display:block;width:12px;height:12px;fill:currentColor}
.fm-play .pa{display:none}
.fm.playing .fm-play .pl{display:none}
.fm.playing .fm-play .pa{display:block}
.fm-t{min-width:0}
.fm-k{display:flex;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.1em;color:var(--wmute);font-variant-numeric:tabular-nums}
.fm-n{font:11px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-list{height:0;overflow:hidden}
.fm.open .fm-list{height:352px;border-top:1px solid #111110}
.fm-list iframe{display:block;width:100%;height:352px;border:0}
.fm-foot{display:flex;align-items:center;gap:10px;padding:6px 10px 8px;border-top:1px solid #11111022;font-size:10px;letter-spacing:.1em}
.fm-foot button,.fm-foot a{color:#111110;text-decoration:none;padding:1px 3px;white-space:nowrap}
.fm-foot a{margin-left:auto}
.fm-foot button:hover,.fm-foot a:hover,.fm-foot button:focus-visible,.fm-foot a:focus-visible{background:var(--yellow)}
.eq{display:flex;align-items:flex-end;gap:2px;height:10px}
.eq i{width:2px;height:2px;background:#111110}
.fm.playing .eq i{animation:eq .9s ease-in-out infinite alternate}
.fm.playing .eq i:nth-child(2){animation-delay:-.3s}.fm.playing .eq i:nth-child(3){animation-delay:-.6s}.fm.playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:10px}}

/* ───────── WORK: index + project pages (clear, calm, lets the work speak) ───────── */
.work{--cbg:#f3f3f0;--cfg:#111110;--cmute:#84847e;--cline:#11111024;--cstage:#e8e8e3;--acc:var(--yellow);
  position:fixed;inset:0;z-index:60;overflow-y:auto;overflow-x:hidden;background:var(--cbg);color:var(--cfg);
  padding:env(safe-area-inset-top,0px) var(--gut) 0;transition:background-color .3s,color .3s}
.work[data-tone="dark"]{--cbg:#0f0f0e;--cfg:#f3f3f0;--cmute:#9c9c95;--cline:#ffffff2b;--cstage:#1c1c1a}
.work :focus-visible{outline-color:var(--cfg)}
.wbar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding-block:20px 12px;background:var(--cbg);transition:background-color .3s;letter-spacing:.04em}
.wbar nav{display:flex;flex-wrap:wrap;gap:4px 18px}
.wbar button{padding:1px 3px;margin-left:-3px}
.wbar button:hover,.wbar button:focus-visible{background:var(--yellow);color:#111110}
.wbar [aria-current="page"]{text-decoration:underline;text-underline-offset:4px}

.widx{padding-block:9vh 180px}
.widx h1{margin:0 0 2.2vh;font:400 13px/1.35 var(--sans);letter-spacing:.04em;display:flex;gap:1.2em}
.widx h1 span{color:var(--cmute);font-variant-numeric:tabular-nums}
.wfilt{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 5vh;max-width:980px;font:11px var(--sys);letter-spacing:.06em;text-transform:uppercase}
.wfilt button{padding:1px 4px;margin-left:-4px;color:var(--cmute)}
.wfilt button:hover,.wfilt button:focus-visible{background:var(--yellow);color:#111110}
.wfilt button[aria-pressed="true"]{background:var(--blue);color:#fff}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:3.4em minmax(0,1fr) minmax(0,1.5fr) 5.2em;column-gap:18px;align-items:baseline;width:100%;padding-block:.36em;
  font-size:clamp(15px,1.5vw,21px);line-height:1.25;text-transform:uppercase;letter-spacing:.01em}
.row .rn,.row .ry{font:.62em/1 var(--mono);letter-spacing:0;font-variant-numeric:tabular-nums}
.row .ry{text-align:right}
.row .rt span{padding:0 .18em;margin-left:-.18em}
.row .rs{color:var(--cmute);text-transform:none;font-size:.72em;letter-spacing:0;overflow-wrap:anywhere}
@media (hover:hover){.rows:hover .row:not(:hover){color:var(--cmute)}}
.row:hover .rt span,.row:focus-visible .rt span{background:var(--yellow);color:#111110}
.row:focus-visible{outline:none}
.peek{position:fixed;left:0;top:0;z-index:70;width:250px;pointer-events:none;background:#fff;color:#111110;border:1px solid #111110;border-radius:7px;overflow:hidden;font-family:var(--sys);box-shadow:0 18px 44px -18px #11111066}
.peek .bar{height:22px;cursor:default}
.peek .bar b{font-size:11px}
.peek img{display:block;width:100%;max-height:300px;object-fit:contain;background:#e8e8e3}

.wsub{display:flex;justify-content:space-between;gap:16px;padding-block:6px 0;font:12px var(--sys);font-variant-numeric:tabular-nums}
.wsub button{padding:1px 3px;margin-left:-3px}
.wsub button:hover,.wsub button:focus-visible{background:var(--acc);color:#111110}
.wsub div{display:flex;gap:14px}
.case{padding-block:8vh 200px}
.chead{max-width:1100px}
.cnum{margin:0 0 14px;font:12px var(--mono);display:flex;align-items:center;gap:8px}
.cnum::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);border:1px solid var(--cfg)}
.case h1{margin:0;font:400 clamp(34px,6.2vw,92px)/.98 var(--sans);letter-spacing:-.038em;text-wrap:balance;overflow-wrap:anywhere}
.csub{margin:14px 0 0;font-size:clamp(16px,1.7vw,22px);line-height:1.3;max-width:40ch;text-wrap:balance}
.cinfo{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:32px clamp(24px,8vw,140px);margin-top:clamp(36px,7vh,80px);align-items:start}
.ctext{min-width:0;font-size:16px;line-height:1.55;max-width:64ch}
.ctext p{margin:0}
.cmeta{margin:0;min-width:0;font:12px/1.5 var(--sys);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px}
.cmeta dt{color:var(--cmute)}
.cmeta dd{margin:0;overflow-wrap:anywhere}
.cmeta a,.blink a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.cmeta a:hover,.blink a:hover{background:var(--acc);color:#111110;text-decoration:none}
.cmeta dd a{display:block}
.cmedia{display:flex;flex-direction:column;gap:clamp(14px,2vw,28px);margin-top:clamp(40px,8vh,96px)}
.cmedia img,.cmedia video{display:block;max-width:100%;height:auto;background:var(--cstage)}
.m-full img{width:100%}
.m-fit img,.m-fit video{width:auto;max-height:88vh}
.m-grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:clamp(8px,1.2vw,18px);align-items:start}
.m-grid img{width:100%}
.m-video video{width:100%;max-height:88vh;background:#000}
.cnone{margin:0;padding:28px 0;font:12px var(--mono);color:var(--cmute);border-top:1px solid var(--cline);border-bottom:1px solid var(--cline)}

.frame{margin:0;border:1px solid var(--cfg);border-radius:7px;overflow:hidden;background:var(--cbg);font-family:var(--sys)}
.frame .bar{cursor:default;border-bottom-color:var(--cfg)}
.frame .bar i{border-color:var(--cfg);background:none}
.frame .bar b{left:60px;right:14px;text-align:left}
.doc{width:100%;max-width:calc(78vh*var(--rw))}
.doc:focus-visible{outline-offset:3px}
.doc-stage{position:relative;aspect-ratio:var(--r);background:var(--cstage)}
.doc-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:none}
.doc-stage button{position:absolute;left:0;top:0;bottom:0;width:38%;cursor:w-resize}
.doc-stage button+button{left:auto;right:0;width:62%;cursor:e-resize}
.doc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid var(--cfg);font-size:12px;font-variant-numeric:tabular-nums}
.doc-foot div{display:flex;align-items:center;gap:10px}
.doc-foot button{width:30px;height:24px;border:1px solid var(--cfg);border-radius:5px;text-align:center}
.doc-foot button:hover:not(:disabled){background:var(--cfg);color:var(--cbg)}
.doc-foot button:disabled{opacity:.3;cursor:default}
.blink{padding:clamp(28px,7vw,90px) clamp(16px,4vw,56px);font-size:clamp(20px,3vw,40px);letter-spacing:-.02em;line-height:1.1}
.blink a{overflow-wrap:anywhere}
.sk{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:clamp(16px,3vw,48px);align-items:start}
.sk canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:var(--cstage);touch-action:none;cursor:crosshair}
.sk-pick{display:flex;gap:8px;margin-top:10px}
.sk-pick button{width:54px;height:54px;border:1px solid var(--cline);overflow:hidden}
.sk-pick button[aria-pressed="true"]{border-color:var(--cfg);outline:1px solid var(--cfg)}
.sk-pick img{width:100%;height:100%;object-fit:cover}
.sk pre{margin:0;padding:14px 16px;font:12px/1.6 var(--mono);overflow-x:auto;tab-size:2}
.cnext{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:clamp(60px,12vh,140px);padding-top:16px;border-top:1px solid var(--cline)}
.cnext button{font-size:clamp(16px,2vw,28px);letter-spacing:-.01em;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.cnext button small{display:block;margin-bottom:6px;font:11px var(--mono);letter-spacing:0;color:var(--cmute)}
.cnext button:last-child{text-align:right}
.cnext button:hover span,.cnext button:focus-visible span{background:var(--acc);color:#111110}
@media (max-width:899px){
  .row{grid-template-columns:2.6em minmax(0,1fr) 4.6em;column-gap:10px}
  .row .rs{display:none}
  .cinfo{grid-template-columns:minmax(0,1fr)}
  .m-grid{grid-template-columns:repeat(min(var(--c),2),minmax(0,1fr))}
  .sk{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:519px){.m-grid[data-solo]{grid-template-columns:minmax(0,1fr)}}

/* ───────── PLAYGROUND: the one folder nobody tidied ───────── */
.pg{--cbg:#f3f3f0;--cfg:#111110;--cmute:#84847e;position:fixed;inset:0;z-index:60;overflow-y:auto;overflow-x:hidden;background:var(--cbg);color:var(--cfg);padding:env(safe-area-inset-top,0px) var(--gut) 0}
.pg :focus-visible{outline-color:var(--blue)}
.pg-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;padding-block:7vh 3vh}
.pg-head h1{margin:0;font:400 13px/1.35 var(--sys);display:flex;gap:1.2em}
.pg-head h1 span{color:var(--cmute)}
.pg-sort{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:11px var(--sys);letter-spacing:.06em;color:var(--cmute)}
.pg-sort button{color:var(--cfg);padding:1px 4px}
.pg-sort button:hover,.pg-sort button:focus-visible{background:var(--yellow);color:#111110}
.pg-sort button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pg-field{position:relative;margin-bottom:190px}
.pf{position:absolute;left:0;top:0;width:118px;display:flex;flex-direction:column;align-items:center;gap:6px;font:11px/1.25 var(--sys);text-align:center;touch-action:none;
  transform:translate(var(--x,0px),var(--y,0px));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pf.drag{transition:none;z-index:5;cursor:grabbing}
.pf img{display:block;max-width:76px;max-height:76px;width:auto;height:auto;background:#fff;padding:3px;border:1px solid #111110;pointer-events:none;user-select:none}
.pf i{display:block;width:44px;height:56px;background:#fff;border:1px solid #111110;position:relative;font:normal 9px/56px var(--mono);letter-spacing:.04em;color:#111110}
.pf i::after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;background:var(--cbg);border-left:1px solid #111110;border-bottom:1px solid #111110}
.pf span{padding:1px 5px;border-radius:3px;overflow-wrap:anywhere;max-width:100%}
.pf:hover span,.pf:focus-visible span{background:var(--blue);color:#fff}
.pf:focus-visible{outline:none}
.pv .sk-win{padding:12px}
.pv .sk-win canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#e8e8e3;touch-action:none;cursor:crosshair}
.pv .sk-win .sk-pick{margin-top:8px}
.pv .sk-win .sk-pick button{border-color:#11111024}
.pv .sk-win .sk-pick button[aria-pressed="true"]{border-color:#111110;outline:1px solid #111110}

/* ───────── narrow screens ───────── */
@media (max-width:819px){
  .desk{display:flex;flex-direction:column;gap:0;padding-bottom:150px}
  .meta{text-align:left;margin-top:14px}
  .meta span{display:inline}
  .meta span+span::before{content:" · "}
  .meta .lang{display:inline-flex;margin:0}
  .me{order:3;align-self:center;height:auto;width:78%;margin:44px 0 0}
  .hand{left:19%;top:95%;font-size:24px}
  .nav{order:4;align-self:flex-start;flex-direction:row;flex-wrap:wrap;gap:6px 18px;margin:56px 0 0}
  .who{order:5;align-self:flex-start;margin-top:64px;font-size:clamp(40px,13.4vw,96px)}
  .files{order:6;flex-direction:row;flex-wrap:wrap;align-self:flex-start;align-items:flex-start;gap:16px 4px;margin:56px 0 0 -12px}
  .file{width:104px}
  .dot{left:calc(var(--mx)*1%);top:calc(var(--my)*1%)}
  .dot.on{--s:132px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function place(el,L,T){const r=el.getBoundingClientRect();

function win({id,title='',cls='',html,w=360,x=.5,y=.42}){
  let el=document.getElementById(id);if(el){front(el);return el}
  el=document.createElement('section');el.id=id;el.className='win '+cls;el.setAttribute('role','dialog');el.setAttribute('aria-label',title||'Message');

  bar.addEventListener('pointermove',e=>{if(on)place(el,e.clientX-ox,e.clientY-oy)});
  bar.addEventListener('pointerup',()=>on=0);bar.addEventListener('pointercancel',()=>on=0);
  return el;

/* ───────── HELP! — drag, delete, rename, type your own ───────── */
function helpInit(el){
  const ul=$('#roles',el);
  const li=t=>{const n=document.createElement('li');n.className='role';
    n.innerHTML=`<span class="t" tabindex="0">${esc(t)}</span><span class="sl" aria-hidden="true">/</span><button type="button" class="del" aria-label="Delete ${esc(t)}">×</button>`;return n};
  const build=()=>{ul.innerHTML='';ROLES.forEach(t=>ul.appendChild(li(t)));
    const b=document.createElement('li');b.className='blank';b.innerHTML='<input id="ownrole" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="type your own" aria-label="Type your own word">';ul.appendChild(b)};
  build();$('#revert',el).onclick=build;
  const edit=t=>{t.contentEditable='true';t.focus();getSelection().selectAllChildren(t)};
  const commit=t=>{t.contentEditable='false';const v=t.textContent.trim().toUpperCase();if(!v)t.closest('li').remove();else{t.textContent=v;$('.del',t.closest('li')).setAttribute('aria-label','Delete '+v)}};
  ul.addEventListener('click',e=>{const d=e.target.closest('.del');if(d)d.closest('li').remove()});
  ul.addEventListener('dblclick',e=>{const t=e.target.closest('.t');if(t)edit(t)});
  ul.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('.t[contenteditable="true"]'))commit(e.target)});
  ul.addEventListener('keydown',e=>{const t=e.target;
    if(t.id==='ownrole'){if(e.key==='Enter'&&t.value.trim()){ul.insertBefore(li(t.value.trim().toUpperCase()),t.closest('li'));t.value=''}return}
    if(!t.matches('.t'))return;const row=t.closest('li');
    if(t.isContentEditable){if(e.key==='Enter'){e.preventDefault();t.blur()}e.stopPropagation();return}
    if(e.key==='Enter'){e.preventDefault();edit(t)}
    else if(e.key==='Backspace'||e.key==='Delete'){const nx=row.nextElementSibling;row.remove();const f=nx&&$('.t,input',nx);if(f)f.focus()}
    else if(e.key==='ArrowUp'&&row.previousElementSibling){ul.insertBefore(row,row.previousElementSibling);t.focus()}
    else if(e.key==='ArrowDown'&&row.nextElementSibling&&row.nextElementSibling.classList.contains('role')){ul.insertBefore(row.nextElementSibling,row);t.focus()}});
  let drag=null,sy=0;
  ul.addEventListener('pointerdown',e=>{const t=e.target.closest('.t');if(!t||t.isContentEditable)return;drag=t.closest('li');sy=e.clientY;t.setPointerCapture(e.pointerId)});
  ul.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientY-sy)<5&&!drag.classList.contains('moving'))return;drag.classList.add('moving');
    const others=$$('li',ul).filter(n=>n!==drag);const before=others.find(n=>{const r=n.getBoundingClientRect();return e.clientY<r.top+r.height/2})||$('.blank',ul);
    if(before!==drag.nextElementSibling)ul.insertBefore(drag,before)});
  const end=()=>{if(drag){drag.classList.remove('moving');drag=null}};
  ul.addEventListener('pointerup',end);ul.addEventListener('pointercancel',end);
}

const me=$('#me');
const hideDots=()=>{$$('.dot.on').forEach(d=>d.classList.remove('on'));delete root.dataset.tint};
function showDot(el,d){$$('.dot.on').forEach(o=>{if(o!==el)o.classList.remove('on')});el.classList.add('on');if(d.tint)root.dataset.tint=d.tint;else delete root.dataset.tint}
function openDot(d){
  if(!d.img)return alertWin({id:'w-missing',mark:'?',title:`“${d.file}” can’t be found.`,text:'The Lineapelle stand photos are not on this computer yet.',buttons:[{label:'OPEN PROJECT',act:()=>{go('p-lineapelle');return false}},{label:'OK',pri:1}]});
  win({id:'w-pv-'+d.n,title:d.file,cls:'pv',w:d.w||500,x:.5,y:.45,html:`<img src="${d.img}" alt="${esc(d.alt)}"><p>${d.cap}${d.pid?`<button type="button" class="btn" data-p="${d.pid}">OPEN PROJECT</button>`:''}</p>`});
}
DOTS.forEach(d=>{
  const el=document.createElement('button');el.type='button';el.className='dot';
  el.style.setProperty('--x',d.x);el.style.setProperty('--y',d.y);el.style.setProperty('--mx',d.mx);el.style.setProperty('--my',d.my);if(d.p)el.style.setProperty('--p',d.p);
  el.setAttribute('aria-label',`Dot ${d.n}: ${d.file}`);
  el.innerHTML=(d.img?`<img src="${d.img}" alt="" draggable="false">`:`<span class="nf" aria-hidden="true">?</span>`)+`<span class="lb">${d.n}<em>&nbsp;&nbsp;${d.file}</em></span>`;
  me.appendChild(el);
  let down=null,moved=false,wasOn=false;
  el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!down)showDot(el,d)});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!down&&!el.matches(':focus-visible')){el.classList.remove('on');delete root.dataset.tint}});
  el.addEventListener('focus',()=>{if(el.matches(':focus-visible'))showDot(el,d)});
  el.addEventListener('blur',()=>{if(!el.matches(':hover')){el.classList.remove('on');if(!$('.dot.on'))delete root.dataset.tint}});
  el.addEventListener('pointerdown',e=>{wasOn=el.classList.contains('on');down={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth};moved=false;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!moved&&Math.hypot(dx,dy)<6)return;
    if(!moved){moved=true;el.classList.add('drag');showDot(el,d)}
    el.style.left=(down.l+down.w/2+dx)+'px';el.style.top=(down.t+down.w/2+dy)+'px'});
  const up=e=>{if(!down)return;down=null;el.classList.remove('drag');
    if(moved||e.type==='pointercancel')return;
    if(e.pointerType==='mouse'||wasOn)openDot(d);else showDot(el,d)};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(e.detail===0)openDot(d)});
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.dot'))hideDots()});

/* ───────── AINOA.FM — Ainoa's Spotify playlist inside our own window ─────────
   Spotify only plays through its own embed, so the list of songs (choose one, skip) is Spotify's,
   shown inside this window; our button drives play / pause. Where the embed is not allowed to load
   (previews that block other sites) the player falls back to a plain link to the playlist. */
const PLAYLIST='1vwP2i7MblzSlrk4iXS9m0';
const fm=$('#fm');let sp=null,spState='loading',playing=false,wantPlay=false;
/* one song at a time: when Spotify would jump to the next song by itself, we pause and let the visitor choose */
let lastURI='',lastPos=0,lastDur=0,wasPaused=true,ended=false,allowNext=false,touch=0;
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function fmUI(pos,dur){fm.classList.toggle('playing',playing);
  $('#fmplay').setAttribute('aria-label',playing?'Pause':'Play');
  $('#fmstate').textContent=spState==='loading'?'CONNECTING':spState==='off'?'SPOTIFY':playing?'NOW PLAYING':'PAUSED';
  if(pos!=null)$('#fmtime').textContent=mmss(pos)+(dur?' / '+mmss(dur):'')}
function fmOpen(v){fm.classList.toggle('open',v);$('#fmpick').setAttribute('aria-expanded',v);$('#fmpick').textContent=v?'HIDE THE LIST':'CHOOSE A SONG'}
function fmOff(){if(spState==='ready')return;spState='off';playing=false;fmOpen(false);
  $('#fmplay').hidden=true;$('#fmlink').hidden=false;$('#fmpick').hidden=true;$('#fmname').textContent='opens in Spotify, new tab';$('#fmtime').textContent='';fmUI()}
function fmOn(){spState='ready';$('#fmplay').hidden=false;$('#fmplay').disabled=false;$('#fmlink').hidden=true;$('#fmpick').hidden=false;$('#fmname').textContent="ainoa's playlist";fmUI();
  if(wantPlay){wantPlay=false;try{sp.play()}catch(_){}}}
function play(){if(spState==='ready'){if(!playing)try{sp.play()}catch(_){}}else if(spState==='loading')wantPlay=true;else $('#fmlink').focus()}
$('#fmplay').addEventListener('click',()=>{if(!sp)return;
  if(ended){allowNext=lastPos>2000;ended=false;$('#fmname').textContent="ainoa's playlist"}
  try{sp.togglePlay()}catch(_){}});
/* a click inside Spotify's list takes focus into its frame: that is how we know the visitor chose a song */
addEventListener('blur',()=>{const a=document.activeElement;if(a&&a.tagName==='IFRAME'&&fm.contains(a)){touch=Date.now();setTimeout(()=>{try{window.focus()}catch(_){}},400)}});
function fmStop(){ended=true;playing=false;try{sp.pause()}catch(_){}fmOpen(true);$('#fmname').textContent='choose the next song'}
function fmUpdate(d){
  const uri=d.playingURI||'',pos=d.position||0,dur=d.duration||0;let stop=false;
  if(lastURI&&uri&&uri!==lastURI){
    const byUser=Date.now()-touch<2500||allowNext||wasPaused;allowNext=false;
    const fullEnd=lastDur>60000&&lastPos>=lastDur-2500;           /* a whole song finished: keep going */
    if(!byUser&&!fullEnd)stop=true;
    else{ended=false;$('#fmname').textContent="ainoa's playlist"}
  }else if(!d.isPaused&&!ended&&!allowNext){
    /* previews have no fixed length, so we only stop early when Spotify itself reports a short clip */
    if(dur&&dur<=60000&&pos>=dur-1200)stop=true;
  }
  lastURI=uri||lastURI;lastPos=pos;lastDur=dur;wasPaused=!!d.isPaused;
  if(stop){fmStop();wasPaused=true}else playing=!d.isPaused;
  fmUI(pos,dur);
}
$('#fmpick').addEventListener('click',()=>fmOpen(!fm.classList.contains('open')));
window.onSpotifyIframeApiReady=api=>{try{api.createController($('#fmembed'),{uri:'spotify:playlist:'+PLAYLIST,width:'100%',height:352},c=>{sp=c;
  c.addListener('ready',fmOn);
  c.addListener('playback_update',e=>{if(spState!=='ready')fmOn();fmUpdate((e&&e.data)||{})})})}catch(_){fmOff()}};
(function(){const t=document.createElement('script');t.src='https://open.spotify.com/embed/iframe-api/v1';t.async=true;t.onerror=fmOff;document.head.appendChild(t);
  setTimeout(()=>{if(spState==='loading')fmOff()},9000)})();
fmUI();

const PDE=`PImage img;
int xstep = 15;
int ystep = 15;

void setup (){
  frameRate (1);
  noStroke ();
  size (600,600);
  img = loadImage("hua copy.jpg");
  img.resize (width,height);
}

void draw (){
ystep = int(map(mouseY,0,height,2,60));
xstep = int(map(mouseX,0,width,2,60));
image (img,0,0);
for (int i = 0; i < width; i= i + xstep){
   for (int j = 0; j < height; j = j + ystep){
   color c = img.get (i,j);
   fill (c);
   rect (i, j, xstep, ystep);
   }
  }
}`;

const TR={"adrift":{"ca":{"s":"Una experiència de supervivència al mar","d":"Adrift és un joc de simulació i supervivència per a jugadors que busquen aïllament i tensió: sobreviure a mar obert vol dir gestionar la gana, la set, les avaries de l’equip i el pes psicològic de la solitud total mentre intentes pescar 100 peixos abans de tornar a port.","w":"Amb Lucas Béjar i Kristyna Borrell. La meva part: la identitat visual del videojoc: gràfics, estètica, tipografia i elements visuals."},"en":{"s":"A survival experience at sea","d":"Adrift is a survival-simulation game for players who crave isolation and tension, where surviving the open sea means managing hunger, thirst, equipment failures, and the psychological weight of complete solitude while struggling to catch 100 fish before returning to port.","w":"With Lucas Béjar and Kristyna Borrell. My part: the visual identity of the video game: graphics, aesthetics, typography and visual elements."}},"groc":{"ca":{"s":"Un videojoc i una controladora per entendre l'ansietat","d":"GROC és una eina de suport emocional en forma de videojoc narratiu. Un laberint de píxels representa l'ansietat i les estrelles que recollites simbolitzen estratègies d'afrontament, com la respiració conscient. Es juga amb una controladora física: una esfera lluminosa amb giroscopi i matriu LED, connectada amb Arduino i Unity.","w":"Projecte d'ELISAVA, amb Rexin Ye. La meva part: branding, disseny gràfic i editorial; vam crear junts el videojoc en Unity i la web, el tràiler en After Effects i la controladora alternativa amb Arduino i giroscopi.","l":"Veure el reel a Instagram"},"en":{"s":"A game and a controller to understand anxiety","d":"GROC is an emotional support tool in the form of a narrative video game. A pixel maze represents anxiety, and the stars you collect stand for coping strategies, like mindful breathing. It is played with a physical controller: a glowing sphere with a gyroscope and LED matrix, connected through Arduino and Unity.","w":"ELISAVA project, with Rexin Ye. My part: branding, graphic and editorial design; together we built the Unity game and the website, the After Effects trailer and the alternative controller with Arduino and a gyroscope.","l":"Watch the reel on Instagram"}},"gnubemail":{"ca":{"s":"Un guant que converteix la sobrecàrrega digital en una pausa","d":"Pot la hibernació ser una nova manera de desconnectar de la feina digital sense sentir-se culpable? Gnubemail és un guant que mesura l'estrès digital a través dels correus sense llegir de Gmail i crea una pausa física: no avisa, no notifica, interromp. Funciona amb Google Apps Script, un ESP32 amb WiFi i un servomotor. Un projecte crític amb la ideologia de l'eficiència i la productivitat."},"en":{"s":"A glove that turns digital overload into a pause","d":"Can hibernation become a new way to disconnect from digital work without feeling guilty? Gnubemail is a glove that measures digital stress through unread Gmail emails and creates a physical pause: it doesn't notify, it doesn't warn, it interrupts. Built with Google Apps Script, a WiFi ESP32 and a servo motor. A critical project against the ideology of efficiency and productivity."}},"telegrafo":{"ca":{"s":"Projecte de recerca · Teories crítiques, ELISAVA","d":"Projecte de recerca: pot un sistema de telègrafs òptics transmetre «mama nem a sopar» entre Montserrat i Montjuïc, entre les 9h i les 21h, de manera 100% analògica? Caminant es tarda 12–14 hores; amb una línia visual contínua de torres històriques (Can Dolcet, Esparreguera, Castellbisbal, Sant Pere Màrtir i el Castell de Montjuïc) el missatge arriba en 2–4 minuts. Estudiem l'emissor i la codificació, la xarxa de retransmissors, la hipòtesi de descodificació i el temps total d'enviament, i ho convertim en una gincana on cada grup és una torre i retransmet amb el cos la postura-símbol rebuda. Fes clic en una imatge per veure tot el procés.","w":"Amb Marta Alcázar, Blanca González, Laura Ibáñez i Rexin Ye · Teories crítiques, grup 3, curs 2025-26"},"en":{"s":"Research project · Critical theories, ELISAVA","d":"Research project: can a system of optical telegraphs relay “mama nem a sopar” between Montserrat and Montjuïc, between 9am and 9pm, 100% analogue? Walking takes 12–14 hours; with a continuous line of sight between historic towers (Can Dolcet, Esparreguera, Castellbisbal, Sant Pere Màrtir and Montjuïc Castle) the message arrives in 2–4 minutes. We studied the sender and coding, the relay network, the decoding hypothesis and the total sending time, and turned it into a gymkhana where each group is a tower and relays the received symbol-posture with their body. Click an image to see the whole process.","w":"With Marta Alcázar, Blanca González, Laura Ibáñez and Rexin Ye · Critical Theories, group 3, 2025-26"}},"anemoia":{"ca":{"s":"Creació amb IA · instal·lacions sensorials","d":"Anemoia: la nostàlgia d'un temps, lloc o època que mai s'ha viscut. Un projecte de visuals generatius amb IA que tradueix aquesta emoció complexa als cinc sentits (veure, sentir, olorar, tocar i tastar) com a instal·lacions imaginades, cadascuna amb el seu concepte i el seu prompt.","w":"Amb Mariana, Camila, Pol i Jan"},"en":{"s":"AI creation · sensory installations","d":"Anemoia: nostalgia for a time, place or era you have never known. A generative-AI visuals project that translates this complex emotion into the five senses (see, hear, smell, touch, taste) as imagined installations, each with its concept and prompt.","w":"With Mariana, Camila, Pol and Jan"}},"afl":{"ca":{"s":"Cartells per a la lliga AFL","d":"Cartells de combat i cartell d'esdeveniment per a l'AFL (Ansgar Fighting League, Prospect Series) a Barcelona: AFL 10 (22.04.23) i AFL 12 (01.07.23). Treball fet amb Estudio Bengala."},"en":{"s":"Posters for the AFL league","d":"Fight cards and an event poster for the AFL (Ansgar Fighting League, Prospect Series) in Barcelona: AFL 10 (22.04.23) and AFL 12 (01.07.23). Made with Estudio Bengala if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  let tx=0,ty=0,x=0,y=0,raf=0,cur='';
  const step=()=>{const k=calm?1:.18;x+=(tx-x)*k;y+=(ty-y)*k;peek.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;raf=peek.hidden?0:requestAnimationFrame(step)};
  const aim=e=>{const w=250,h=peek.offsetHeight||240;tx=Math.min(e.clientX+26,innerWidth-w-12);ty=Math.max(12,Math.min(e.clientY+18,innerHeight-h-12))};
  $('#rows').addEventListener('pointermove',e=>{const r=e.target.closest('.row');const p=r&&PROJ.find(q=>q.id===r.dataset.p);
    if(!p||!p.th){peek.hidden=true;cur='';return}

/* project page */
function caseHtml(p,i){
  const prev=PROJ[(i-1+PROJ.length)%PROJ.length],next=PROJ[(i+1)%PROJ.length];
  const links=(p.links||[]).concat(p.media.filter(b=>b.t==='link').map(b=>[b.url,b.label])).map((l,k)=>[l[0],linkL(p,k,l[1])]);const w=tr(p,'w'),d=tr(p,'d');
  return `<div class="wsub"><button type="button" data-go="work">← INDEX</button><div><button type="button" data-p="${prev.id}" aria-label="${U().pprev}: ${esc(prev.n)}">← ${pad2((i-1+PROJ.length)%PROJ.length+1)}</button><button type="button" data-p="${next.id}" aria-label="${U().pnext}: ${esc(next.n)}">${pad2((i+1)%PROJ.length+1)} →</button></div></div>
  <article class="case"><header class="chead"><p class="cnum">${pad2(i+1)} / ${PROJ.length}</p><h1>${esc(p.n)}</h1><p class="csub">${esc(tr(p,'s'))}</p></header>
  <div class="cinfo"><div class="ctext">${d?`<p>${esc(d)}</p>`:''}</div>
  <dl class="cmeta"><dt>${U().year}</dt><dd>${p.y}</dd><dt>${U().disc}</dt><dd>${esc(tagsOf(p).map(role).join(' · '))}</dd>${w?`<dt>${U().cred}</dt><dd>${esc(w)}</dd>`:''}${links.length?`<dt>${U().links}</dt><dd>${links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]} ↗</a>`).join('')}</dd>`:''}</dl></div>
  <div class="cmedia">${p.media.map(b=>BLOCK[b.t](b,p)).join('')}</div>
  <nav class="cnext" aria-label="${U().others}"><button type="button" data-p="${prev.id}"><small>← ${pad2((i-1+PROJ.length)%PROJ.length+1)}</small><span>${esc(prev.n)}</span></button><button type="button" data-p="${next.id}"><small>${pad2((i+1)%PROJ.length+1)} →</small><span>${esc(next.n)}</span></button></nav></article>`;
}

  doc.dataset.i=i;const im=$('.doc-stage img',doc);im.src=pg(f,i);im.alt=im.alt.replace(/\d+ \/ \d+$/,i+' / '+n);
  $('.doc-n',doc).textContent=i+' / '+n;const b=$$('.doc-foot button',doc);b[0].disabled=i<=1;b[1].disabled=i>=n;
  if(i<n){const pre=new Image();pre.src=pg(f,i+1)}

/* Processing sketch, ported line for line: X sets the width of each rectangle, Y the height */
let skData=null;
function sketchDraw(xs,ys){const c=$('#skc');if(!c||!skData)return;const g=c.getContext('2d');g.putImageData(skData,0,0);const d=skData.data;
  for(let i=0;i<600;i+=xs)for(let j=0;j<600;j+=ys){const k=(j*600+i)*4;g.fillStyle=`rgb(${d[k]},${d[k+1]},${d[k+2]})`;g.fillRect(i,j,xs,ys)}}
function sketchLoad(n){const c=$('#skc');if(!c)return;$$('[data-sk]',wcase).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.sk===n));
  const im=new Image();im.onload=()=>{const g=c.getContext('2d');g.drawImage(im,0,0,600,600);try{skData=g.getImageData(0,0,600,600);sketchDraw(15,15)}catch(_){skData=null}};im.src='p/img/sk-'+n+'.jpg'}
function sketchInit(){const c=$('#skc');if(!c)return;skData=null;sketchLoad(1);
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),m=v=>Math.max(2,Math.min(60,Math.floor(2+v*58)));
    sketchDraw(m((e.clientX-r.left)/r.width),m((e.clientY-r.top)/r.height))})}

/* routing: #work is the index, #p-<id> a project; anything else is home */
let here='';
function route(h){
  h=h||'';const i=PROJ.findIndex(p=>'p-'+p.id===h),isPg=h==='playground';
  if(h!=='work'&&i<0&&!isPg){here='';work.hidden=true;pgEl.hidden=true;peek.hidden=true;desk.inert=false;return}
  if(here!==h){$$('.win').forEach(w=>{if(w.id!=='w-gate')closeWin(w)});hideDots()}
  desk.inert=true;peek.hidden=true;work.hidden=isPg;pgEl.hidden=!isPg;
  if(isPg){pgInit();if(here!==h)pgEl.scrollTop=0;here=h;return}
  if(i<0){widx.hidden=false;wcase.hidden=true;wcase.innerHTML='';delete work.dataset.tone;work.style.removeProperty('--acc')}
  else{const p=PROJ[i];widx.hidden=true;wcase.hidden=false;wcase.innerHTML=caseHtml(p,i);
    if(p.tone)work.dataset.tone=p.tone;else delete work.dataset.tone;
    if(p.acc)work.style.setProperty('--acc',p.acc);else work.style.removeProperty('--acc');
    sketchInit()}
  if(here!==h)work.scrollTop=0;here=h;
}

/* the Processing sketch again, inside its own window */
function mosaic(el){const c=$('canvas',el),g=c.getContext('2d');let data=null;
  const draw=(xs,ys)=>{if(!data)return;g.putImageData(data,0,0);const d=data.data;for(let i=0;i<600;i+=xs)for(let j=0;j<600;j+=ys){const k=(j*600+i)*4;g.fillStyle=`rgb(${d[k]},${d[k+1]},${d[k+2]})`;g.fillRect(i,j,xs,ys)}};
  const load=n=>{$$('[data-n]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));const im=new Image();im.onload=()=>{g.drawImage(im,0,0,600,600);try{data=g.getImageData(0,0,600,600);draw(15,15)}catch(_){data=null}};im.src='p/img/sk-'+n+'.jpg'};
  el.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)load(+b.dataset.n)});
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),m=v=>Math.max(2,Math.min(60,Math.floor(2+v*58)));draw(m((e.clientX-r.left)/r.width),m((e.clientY-r.top)/r.height))});
  load(1)}
/* where each file sits: a grid, plus a fixed amount of carelessness per file in MESS */
function pgLayout(){
  const W=pgField.clientWidth,cw=W<520?112:150,ch=W<520?128:142,cols=Math.max(2,Math.floor(W/cw)),gx=(W-cols*cw)/Math.max(1,cols-1),j=W<520?10:34;
  const order=FILES.map((f,i)=>i);
  if(pgMode==='name')order.sort((a,b)=>FILES[a].n.localeCompare(FILES[b].n));
  if(pgMode==='kind')order.sort((a,b)=>FILES[a].n.split('.').pop().localeCompare(FILES[b].n.split('.').pop())||FILES[a].n.localeCompare(FILES[b].n));
  order.forEach((fi,slot)=>{const el=pgField.children[fi],col=slot%cols,row=Math.floor(slot/cols);
    const r1=Math.sin(fi*12.9898)*43758.5453,r2=Math.sin(fi*78.233)*12543.123,dx=pgMode==='mess'?((r1-Math.floor(r1))-.5)*2*j:0,dy=pgMode==='mess'?((r2-Math.floor(r2))-.5)*2*j:0;
    const x=Math.max(0,Math.min(W-118,col*(cw+gx)+(cw-118)/2+dx)),y=Math.max(0,row*ch+j+dy);
    el.style.setProperty('--x',Math.round(x)+'px');el.style.setProperty('--y',Math.round(y)+'px')});
  pgField.style.height=(Math.ceil(FILES.length/cols)*ch+2*j+40)+'px';
}
function pgInit(){
  if(!pgBuilt){pgBuilt=true;$('#pgcount').textContent=FILES.length+' items';
    pgField.innerHTML=FILES.map((f,i)=>`<button type="button" class="pf" data-f="${i}">${f.k==='jpg'||f.thumb?`<img src="${pgThumb(f)}" alt="" draggable="false">`:`<i aria-hidden="true">${f.n.split('.').pop().toUpperCase().slice(0,5)}</i>`}<span>${f.n}</span></button>`).join('');
    $$('.pf',pgField).forEach(el=>{const f=FILES[+el.dataset.f];let down=null,moved=false;
      el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,ox:parseFloat(el.style.getPropertyValue('--x'))||0,oy:parseFloat(el.style.getPropertyValue('--y'))||0};moved=false;el.setPointerCapture(e.pointerId)});
      el.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;el.classList.add('drag');
        el.style.setProperty('--x',Math.max(0,Math.min(pgField.clientWidth-118,down.ox+dx))+'px');el.style.setProperty('--y',Math.max(0,down.oy+dy)+'px')});
      const up=e=>{if(!down)return;down=null;el.classList.remove('drag');if(!moved&&e.type==='pointerup')pgOpen(f)};
      el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
      el.addEventListener('click',e=>{if(e.detail===0)pgOpen(f)})});
    $$('[data-sort]',pgEl).forEach(b=>b.addEventListener('click',()=>{pgMode=b.dataset.sort;$$('[data-sort]',pgEl).forEach(o=>o.setAttribute('aria-pressed',o===b));pgLayout()}));
    addEventListener('resize',()=>{if(!pgEl.hidden)pgLayout()});
  }
  pgLayout();
}
